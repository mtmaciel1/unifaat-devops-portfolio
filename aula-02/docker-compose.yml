version: '3.8'

services:
  # ================================
  # Serviço: API Node.js
  # ================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technova-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-technova}
      - DB_USER=${DB_USER:-technova}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - technova-network
    restart: unless-stopped

  # ================================
  # Serviço: PostgreSQL (Banco)
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: technova-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-technova}
      POSTGRES_USER: ${POSTGRES_USER:-technova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technova"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technova-network
    restart: unless-stopped

  # ================================
  # Serviço: Redis (Cache)
  # ================================
  redis:
    image: redis:7-alpine
    container_name: technova-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - technova-network
    restart: unless-stopped

# ================================
# Redes e Volumes
# ================================
networks:
  technova-network:
    driver: bridge

volumes:
  pg-data: